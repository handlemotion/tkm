name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  release-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|test)(\([^)]+\))?(!)?:[[:space:]].+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must use Conventional Commit syntax, for example: fix: correct selection persistence" >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify versions, Python syntax, and installer payload
        run: |
          python3 -m json.tool release-please-config.json >/dev/null
          python3 -m json.tool .release-please-manifest.json >/dev/null
          python3 tools/release.py verify
      - name: Check Maya.env marker removal
        run: python3 tools/check_maya_env.py
      - name: Build and inspect the installer package
        run: python3 tools/release.py package --output-dir "$RUNNER_TEMP/tkm-release"
