name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.1.5 or v0.1.5-beta.1)
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify requested tag and embedded versions
        env:
          TAG: ${{ inputs.tag }}
        run: python3 tools/release.py verify --tag "$TAG"
      - name: Package installer payload
        env:
          TAG: ${{ inputs.tag }}
        run: python3 tools/release.py package --tag "$TAG" --output-dir dist
      - name: Ensure the requested tag is new
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
          TAG: ${{ inputs.tag }}
        run: |
          prerelease_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$TAG" \
            "dist/TheKeyMachine-$TAG.zip" \
            "dist/TheKeyMachine-$TAG.zip.sha256" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            "${prerelease_args[@]}"
